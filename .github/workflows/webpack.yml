name: NodeJS with Webpack

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          clean: true

      - name: Debug what checkout actually got
        run: |
          echo "--- PWD ---"
          pwd
          echo "--- FILES ---"
          ls -la
          echo "--- BRANCH ---"
          git branch --show-current
          git log --oneline -5
          echo "--- FILES IN GIT ---"
          git ls-files | head -n 50

      - uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: Build
        run: |
          npm install
          npm run build
