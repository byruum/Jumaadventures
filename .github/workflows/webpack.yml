name: NodeJS with Webpack

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js 20.x
      uses: actions/setup-node@v4
      with:
        node-version: 20.x
    - name: Restore package.json that checkout drops
      run: |
        ls -la package.json || echo "MISSING - restoring from git"
        git show HEAD:package.json > package.json
        ls -la package.json
        head -20 package.json
    - name: Build
      run: |
        npm install
        npm run build
