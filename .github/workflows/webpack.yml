name: NodeJS with Webpack

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: CHECK 1 - after checkout
      run: |
        pwd
        ls -la
        ls -la package.json
    - name: Use Node.js 20.x
      uses: actions/setup-node@v4
      with:
        node-version: 20.x
    - name: CHECK 2 - after setup-node
      run: |
        pwd
        ls -la
        ls -la package.json
        cat package.json
    - name: Build
      run: |
        npm install
        npm run build
