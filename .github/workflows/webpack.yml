name: NodeJS with Webpack

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: List files
      run: |
        echo "=== ROOT ==="
        ls -la
        echo "=== ALL FOLDERS ==="
        find . -maxdepth 3 -type f -name "package.json" | head -20
        echo "=== FOLDERS ==="
        ls -R | head -100
