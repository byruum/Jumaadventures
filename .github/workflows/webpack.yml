name: NodeJS with Webpack

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          clean: true

      - uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: Build
        run: |
          echo "--- WHERE AM I ---"
          pwd
          echo "--- FILES IN BUILD STEP ---"
          ls -la
          ls -b
          echo "--- TRY TO READ IT ---"
          cat package.json
          echo "--- NOW NPM ---"
          npm install
          npm run build
