name: NodeJS with Webpack

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: DEBUG - what does checkout actually see?
      run: |
        echo "=== BRANCH / COMMIT ==="
        git branch --show-current
        git log --oneline -5
        echo "=== FILES IN GIT ==="
        git ls-files | head -50
        echo "=== FILES ON DISK ==="
        ls -la
        echo "=== PACKAGE.JSON? ==="
        ls -la package.json || echo "MISSING ON DISK"
        cat package.json | head -5 || echo "CANNOT READ"
